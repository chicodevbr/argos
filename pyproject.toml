[project]
name = "apuracao"
version = "0.1.0"
description = "Coleta, projeção e análise da apuração do TSE"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "streamlit>=1.36",
    # Upload para o Cloudflare R2 (API S3). Cliente S3 padrão, com retry e
    # assinatura SigV4 prontos; mais robusto que assinar requisições à mão.
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apuracao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes nunca acessam a rede: o coletor usa httpx.MockTransport.
# Testes assíncronos usam o plugin do anyio (já vem com o httpx): @pytest.mark.anyio
