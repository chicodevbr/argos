<title>Eleições 2026 em dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita e centralizada (lista de links): título, apresentação e um botão grande por
   página, agrupados por tema. Mesmos tokens das páginas do site. */
:root {
  --fundo: #f5f6f8; --superficie: #ffffff; --tinta: #15181e; --tinta-2: #4a505d; --apagado: #737a89;
  --linha: #dde1e7; --realce: #15181e; --raio: 10px;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --texto: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fundo: #111317; --superficie: #191c21; --tinta: #eef0f3; --tinta-2: #b9bec8; --apagado: #8b91a0;
    --linha: #2a2e36; --realce: #eef0f3;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: #111317; --superficie: #191c21; --tinta: #eef0f3; --tinta-2: #b9bec8; --apagado: #8b91a0;
  --linha: #2a2e36; --realce: #eef0f3;
}
* { box-sizing: border-box; }
body { background: var(--fundo); color: var(--tinta); font: 400 16px/1.55 var(--texto); padding: 56px 20px 64px; }
.coluna { max-width: 560px; margin: 0 auto; display: grid; gap: 36px; }
.cabeca { display: grid; gap: 10px; text-align: center; justify-items: center; }
.rotulo { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--apagado); font-weight: 500; }
h1 { font: 700 clamp(2.6rem, 9vw, 3.6rem)/1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--tinta-2); max-width: 46ch; text-wrap: balance; }
.grupo { display: grid; gap: 12px; }
.grupo h2 { margin: 0; font: 500 .78rem/1 var(--texto); text-transform: uppercase; letter-spacing: .08em; color: var(--apagado); }
.botao { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; text-decoration: none;
  color: var(--tinta); background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 18px 20px; }
.botao b { font: 600 1.45rem/1.1 var(--display); letter-spacing: .01em; }
.botao span { grid-column: 1; font-size: .9rem; color: var(--tinta-2); }
.botao i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font-size: 1.3rem; color: var(--apagado); }
.botao:hover { border-color: var(--realce); }
.botao:hover i { color: var(--tinta); }
.botao:focus-visible { outline: 2px solid var(--realce); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .botao { transition: border-color .15s, transform .15s; }
  .botao i { transition: transform .15s, color .15s; }
  .botao:hover { transform: translateY(-1px); }
  .botao:hover i { transform: translateX(3px); }
}
.rodape { text-align: center; font-size: .82rem; color: var(--apagado); display: grid; gap: 4px; }
.rodape a { color: var(--tinta-2); }
</style>

<main class="coluna">
  <header class="cabeca">
    <span class="rotulo">Eleições 2026 · Presidente</span>
    <h1>Eleições 2026 em dados</h1>
    <p class="lede">Abstenção e votos do 1º turno de 2026, por região, cidade e estado, comparados às eleições anteriores. Dados públicos do TSE.</p>
  </header>
  <div id="grupos" style="display:grid;gap:28px"></div>
  <footer class="rodape">
    <span>Fontes: TSE (resultados e dados abertos), IBGE, GDF e Prefeitura do Rio.</span>
    <span>Código aberto: <a href="https://github.com/chicodevbr/argos">github.com/chicodevbr/argos</a></span>
  </footer>
</main>

<script>
const PAGINAS = __PAGINAS__;
const alvo = document.getElementById("grupos");
for (const grupo of [...new Set(PAGINAS.map(p => p.grupo))]) {
  const sec = document.createElement("section");
  sec.className = "grupo";
  const h = document.createElement("h2"); h.textContent = grupo; sec.appendChild(h);
  for (const p of PAGINAS.filter(p => p.grupo === grupo)) {
    const a = document.createElement("a");
    a.className = "botao"; a.href = `/${p.sub}/`;
    a.innerHTML = "<b></b><span></span><i aria-hidden=\"true\">→</i>";
    a.querySelector("b").textContent = p.titulo;
    a.querySelector("span").textContent = p.descricao;
    sec.appendChild(a);
  }
  alvo.appendChild(sec);
}
</script>
