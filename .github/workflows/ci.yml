name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest  # ubuntu-24.04 fixo ficou sem runner (05/10); ensaiar de novo após 19/10 (Ubuntu 26)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: bash -n scripts/coleta.sh
      # Workflow com YAML inválido some da aba Actions sem erro visível.
      - name: Validar YAML dos workflows
        run: uv run --no-project --with pyyaml python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"
