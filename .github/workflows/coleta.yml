name: coleta

on:
  workflow_dispatch:
    inputs:
      ambiente:
        type: choice
        options: [oficial, simulado]
        default: oficial
      eleicoes:
        description: "ensaio = 1º turno (dados já encerrados); segundo-turno = noite da eleição"
        type: choice
        # Sem perfil válido por padrão: em 25/10/2026 os dois disparos manuais saíram
        # com o `ensaio` pré-selecionado e coletaram o 1º turno a noite toda.
        options: [escolher, ensaio, segundo-turno]
        default: escolher
      duracao:
        description: segundos de coleta (máx. ~20400 para caber em 6h)
        default: "20400"
      municipios:
        description: incluir arquivos de cada município (base da projeção)
        type: boolean
        default: true
  # Sem schedule: os crons de reserva de 25/10/2026 ("45 19 25 10 *" e "45 0 26 10 *")
  # disparariam todo 25/10 com os códigos de 2026. Numa próxima eleição, recolocar com
  # os códigos novos, sabendo que em 25/10/2026 atrasaram 2h17 e 4h33.

permissions:
  contents: read

jobs:
  coleta:
    runs-on: ubuntu-latest  # ubuntu-24.04 fixo ficou sem runner (05/10); ensaiar de novo após 19/10 (Ubuntu 26)
    timeout-minutes: 355  # 5h55: abaixo do limite de 6h
    env:
      AMBIENTE: ${{ inputs.ambiente || 'oficial' }}
      # Sem inputs (só via API) também cai em `escolher` e falha. Traduzido para ids no passo Coletar.
      PERFIL: ${{ inputs.eleicoes || 'escolher' }}
      DURACAO: ${{ inputs.duracao || '20400' }}
      # Compara como texto: sem inputs, e `null == false` é verdadeiro
      # nas expressões do Actions (ambos viram 0), o que desligaria os municípios.
      MUNICIPIOS: ${{ format('{0}', inputs.municipios) == 'false' && '0' || '1' }}
      DIR_RAW: data/raw
      LOGS: logs
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync --frozen --no-dev

      - name: Coletar
        run: |
          case "$PERFIL" in
            escolher)      echo "::error::escolha o perfil em 'eleicoes' (ensaio ou segundo-turno)"; exit 2 ;;
            ensaio)        export ELEICOES="2026-t1-federal" ;;
            segundo-turno) export ELEICOES="2026-t2-federal 2026-t2-estadual" ;;
            *) echo "::error::perfil desconhecido: $PERFIL"; exit 2 ;;
          esac
          echo "ambiente=$AMBIENTE perfil=$PERFIL eleicoes=$ELEICOES duracao=$DURACAO municipios=$MUNICIPIOS"
          scripts/coleta.sh

      # Redundância: além do R2, guarda tudo como artefato do run.
      - name: Empacotar snapshots
        if: always()
        run: tar -czf snapshots.tar.gz data/raw logs 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots-${{ github.run_id }}
          path: snapshots.tar.gz
          retention-days: 90
