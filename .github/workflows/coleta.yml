name: coleta

on:
  workflow_dispatch:
    inputs:
      ambiente:
        type: choice
        options: [oficial, simulado]
        default: oficial
      eleicoes:
        description: "ensaio = 1º turno (dados já encerrados); segundo-turno = noite da eleição"
        type: choice
        options: [ensaio, segundo-turno]
        default: ensaio
      duracao:
        description: segundos de coleta (máx. ~20400 para caber em 6h)
        default: "20400"
      municipios:
        description: incluir arquivos de cada município (base da projeção)
        type: boolean
        default: true
  schedule:
    # 25/10, 19:45 UTC = 16:45 em Brasília. Cron do GitHub pode atrasar ou
    # falhar em horário de pico: é só reserva. O disparo principal é manual.
    - cron: "45 19 25 10 *"

permissions:
  contents: read

jobs:
  coleta:
    runs-on: ubuntu-latest  # ubuntu-24.04 fixo ficou sem runner (05/10); ensaiar de novo após 19/10 (Ubuntu 26)
    timeout-minutes: 355  # 5h55: abaixo do limite de 6h
    env:
      AMBIENTE: ${{ inputs.ambiente || 'oficial' }}
      # Cron (sem inputs) cai no 2º turno. Traduzido para ids no passo Coletar.
      PERFIL: ${{ inputs.eleicoes || 'segundo-turno' }}
      DURACAO: ${{ inputs.duracao || '20400' }}
      # Compara como texto: no cron não há inputs, e `null == false` é verdadeiro
      # nas expressões do Actions (ambos viram 0), o que desligaria os municípios.
      MUNICIPIOS: ${{ format('{0}', inputs.municipios) == 'false' && '0' || '1' }}
      DIR_RAW: data/raw
      LOGS: logs
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync --frozen --no-dev

      - name: Coletar
        run: |
          case "$PERFIL" in
            ensaio)        export ELEICOES="2026-t1-federal" ;;
            segundo-turno) export ELEICOES="2026-t2-federal 2026-t2-estadual" ;;
            *) echo "::error::perfil desconhecido: $PERFIL"; exit 2 ;;
          esac
          echo "ambiente=$AMBIENTE perfil=$PERFIL eleicoes=$ELEICOES duracao=$DURACAO municipios=$MUNICIPIOS"
          scripts/coleta.sh

      # Redundância: além do R2, guarda tudo como artefato do run.
      - name: Empacotar snapshots
        if: always()
        run: tar -czf snapshots.tar.gz data/raw logs 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshots-${{ github.run_id }}
          path: snapshots.tar.gz
          retention-days: 90
