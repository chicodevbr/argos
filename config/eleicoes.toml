# Configuração das eleições acompanhadas pelo coletor.
# Nenhum código de eleição deve ficar fixo no código Python: tudo vem daqui.

[ambientes]
oficial = "https://resultados.tse.jus.br/oficial"
simulado = "https://resultados-sim.tse.jus.br/simulado"

[cargos]
presidente = 1
governador = 3

[urls]
# Placeholders: {ciclo}, {eleicao}, {uf}, {cod_mun}, {cargo}
resultado = "/{ciclo}/{eleicao}/dados/{uf}/{uf}-c{cargo:04d}-e{eleicao:06d}-u.json"
resultado_municipio = "/{ciclo}/{eleicao}/dados/{uf}/{uf}{cod_mun}-c{cargo:04d}-e{eleicao:06d}-u.json"
acompanhamento = "/{ciclo}/{eleicao}/dados/{uf}/{uf}-c{cargo:04d}-e{eleicao:06d}-ab.json"
config_municipios = "/{ciclo}/{eleicao}/config/mun-e{eleicao:06d}-cm.json"

# --- 2026, 1º turno -------------------------------------------------------
# Códigos vindos de projetos da comunidade. Confirmados em 05/10/2026: os
# arquivos br/uf/município e -cm.json respondem 200 no ambiente oficial.
[[eleicao]]
id = "2026-t1-federal"
ciclo = "ele2026"
turno = 1
codigo = 6257
cargos = ["presidente"]
confirmado = true

[[eleicao]]
id = "2026-t1-estadual"
ciclo = "ele2026"
turno = 1
codigo = 6259
cargos = ["governador"]
confirmado = true

# --- 2026, 2º turno -------------------------------------------------------
# Códigos = campo `cdt2` ("código da eleição para o segundo turno", spec EA11)
# das eleições 6257/6259 em /oficial/comum/config/ele-c.json (cópia em
# tests/fixtures/ele-c.json). `confirmado = false` até os arquivos do 2º turno
# responderem 200 no ambiente oficial (em 05/10 ainda dão 404, o que é esperado).
[[eleicao]]
id = "2026-t2-federal"
ciclo = "ele2026"
turno = 2
codigo = 6258
cargos = ["presidente"]
confirmado = false

[[eleicao]]
id = "2026-t2-estadual"
ciclo = "ele2026"
turno = 2
codigo = 6260
cargos = ["governador"]
confirmado = false
# Só UFs com 2º turno para governador: as demais dariam 404 a noite toda, e o
# TSE avisa que muitos 404 podem bloquear o IP. Lista tirada do 1º turno
# (candidatos com st = "2º turno" nos arquivos UF da 6259, tf = s, 05/10/2026).
# Conferir com o `abr` da eleição 6260 no ele-c.json quando for publicado.
ufs = ["ac", "am", "df", "es", "rj", "rn", "to"]

[coletor]
intervalo_uf_s = 30
intervalo_municipio_s = 600  # ~6.300 arquivos no 2º turno -> ~10 req/s, abaixo de max_req_s
timeout_s = 10
duracao_max_s = 20700  # 5h45: encerra antes do limite de 6h do GitHub Actions
dir_raw = "data/raw"
concorrencia = 8          # requisições simultâneas no máximo
backoff_base_s = 2
backoff_max_s = 120
max_espera_404_s = 300    # 404 seguidos: espera dobra até este teto (ver docs/tse/instrucoes-tse.md)
max_req_s = 20            # teto global de requisições/s; o TSE bloqueia acima de 100/s por IP
# Lista de municípios usada se o -cm.json da eleição não existir na partida (o do
# 2º turno deu 404 até 05/10). Cópia do mun-e006257-cm.json do 1º turno: os
# municípios e localidades do exterior são os mesmos nos dois turnos.
municipios_reserva = "config/municipios-reserva-2026.json"
# "resultado" (-u.json) e/ou "acompanhamento" (-ab.json)
tipos = ["resultado"]
# Cargos com arquivo nacional (br) e do exterior (zz)
cargos_nacionais = ["presidente"]
ufs = [
  "ac", "al", "am", "ap", "ba", "ce", "df", "es", "go", "ma", "mg", "ms", "mt", "pa",
  "pb", "pe", "pi", "pr", "rj", "rn", "ro", "rr", "rs", "sc", "se", "sp", "to",
]

# --- Histórico: Portal de Dados Abertos do TSE ------------------------------
# Leiautes: leiame.pdf dentro de cada zip. Latin-1, ';', #NULO = -1, #NE = -3.
[historico]
base = "https://cdn.tse.jus.br/estatistica/sead/odsele"
votacao = "/votacao_candidato_munzona/votacao_candidato_munzona_{ano}.zip"
detalhe = "/detalhe_votacao_munzona/detalhe_votacao_munzona_{ano}.zip"
dir = "data/raw/historico"
